[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "variance_analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "openpyxl",
    "numba",
    "joblib",
    "matplotlib",
    "plotly<6",  # kaleido 0.2.1 only works with plotly 5
    "kaleido==0.2.1",
    "tqdm",
    "scikit-learn",
    "statsmodels",
    "jupyter",
]

[project.optional-dependencies]
# deep-network analyses (notebooks/model_neurons.ipynb, notebooks/run_model_layers.py)
ann = [
    "torch",
    "torchvision",
    "transformers",
    "opencv-python",
    "scikit-image",
]

[tool.setuptools]
packages = ["src", "src.ann"]
